name: Update Master M3U

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes. GitHub Actions uses UTC unless a timezone is specified.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-master-m3u
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Merge source playlists
        run: python merge_playlists.py

      - name: Commit updated master playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add master.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Auto update master playlist"
            git push
          fi
