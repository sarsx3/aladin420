name: Auto Update JSON

on:
  # Backup schedule — GitHub's minimum cron interval is 5 minutes.
  # NOTE: on the free tier, scheduled runs can queue/lag during GitHub's
  # peak load (sometimes several minutes, rarely longer). That's why this
  # workflow ALSO listens for repository_dispatch below — pair it with an
  # external 1-minute cron (see README) for near-real-time updates.
  schedule:
    - cron: '*/5 * * * *'

  # Triggered instantly by an external cron service hitting the GitHub API
  repository_dispatch:
    types: [update-json]

  # Lets you trigger it manually from the Actions tab any time
  workflow_dispatch:

# Prevent overlapping runs from piling up / racing each other on commit
concurrency:
  group: auto-update-json
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fetches Tapmad (source of truth for the JSON structure) + SonyLiv,
      # reshapes SonyLiv into Tapmad's schema, merges both into a single
      # sorted playlist, and writes it to data/merged_playlist.json.
      - name: Fetch sources & build merged output JSON
        run: python3 scripts/update_json.py

      - name: Commit & push only if something changed
        run: |
          git config user.name "auto-updater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "auto: update data [$(date -u +'%Y-%m-%dT%H:%M:%SZ')]"
            git pull --rebase --autostash
            git push
          fi
